name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# 最小权限：CI 只读代码、传产物，不给 GITHUB_TOKEN 写权限
permissions:
  contents: read

env:
  JAVA_VERSION: '17'
  # 刻意不设 ANDROID_COMPILE_SDK：compileSdk 的唯一出处是各模块 build.gradle.kts，
  # 这里再写一份就是第二处真相（而且这份 ci.yml 会被 install-kit.sh 原样拷进别的项目，
  # 那边 compileSdk 未必一样）。AGP 会按 build.gradle.kts 里声明的版本自动装对应平台。

# 这份 YAML 是「薄壳」：每个 job 只说「在什么环境跑哪道门禁」，
# 门禁逻辑全在 scripts/ci.sh 里 —— fork 想改门禁改脚本，不动这个文件（它是底座路径）。
# 加一道新门禁的完整步骤见 scripts/ci.sh 头部注释。

jobs:
  build:
    name: Build (Android)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK + Android SDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'true'

      # 遍历 apps/ 下所有模块：fork 加新 app 只需新建 apps/<name>/，不用改这份 ci.yml
      - name: Build Android apps
        run: bash scripts/ci.sh build-android

      - name: Upload debug APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: success()
        with:
          name: debug-apk
          path: apps/*/build/outputs/apk/debug/*.apk
          retention-days: 7

  desktop:
    name: Build (Desktop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'false'

      # 测试在下面的 unit-test job 跑，这里只管编译和打包，别跑两遍
      - name: Compile desktop
        run: bash scripts/ci.sh build-desktop

      - name: Package desktop
        run: bash scripts/ci.sh package-deb

      - name: Upload desktop package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: success()
        with:
          name: desktop-deb
          path: kit/build/compose/binaries/main/deb/*.deb
          retention-days: 7

  ios:
    name: Build (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'false'

      # iOS 目标只在 macOS host 上能编（Kotlin/Native 限制）
      # linkDebugFramework* 产出的 .framework 就是 Xcode 要 import 的东西
      - name: Link iOS frameworks
        run: bash scripts/ci.sh build-ios

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: success()
        with:
          name: ios-frameworks
          path: kit/build/bin/ios*/debugFramework/
          retention-days: 7

  ios-app:
    name: Build (iOS App)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'false'

      # iOS 壳工程的 Xcode 工程是 XcodeGen 生成的（apps/*/ios/project.yml）
      - name: Install XcodeGen
        run: brew install xcodegen

      # 遍历 apps/ 下所有带 ios/ 目录的 app：
      # fork 加新 app 只需建 apps/<name>/ios/，不用改这份 ci.yml
      - name: Build iOS apps
        run: |
          rc=0
          for d in apps/*/ios; do
            [ -d "$d" ] || continue
            bash "$d/build.sh" || rc=1
          done
          exit $rc

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK + Android SDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'true'

      - name: Run lint
        run: bash scripts/ci.sh lint

      - name: Upload lint report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: lint-report
          path: apps/*/build/reports/lint-results-debug.html
          retention-days: 7

  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'false'

      # 真正的测试都在 kit / kit-agent-koog 的 desktopTest（commonTest 只在 JVM 跑得起来）。
      # apps/* 的 testDebugUnitTest 目前都是 NO-SOURCE，但 fork 的 app 加了单测就自动进来。
      - name: Run unit tests
        run: bash scripts/ci.sh test

      - name: Upload test report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: test-report
          path: |
            kit/build/reports/tests/desktopTest/
            kit-agent-koog/build/reports/tests/desktopTest/
            kit-membership/build/reports/tests/desktopTest/
          retention-days: 14

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: test-results
          path: |
            kit/build/test-results/desktopTest/
            kit-agent-koog/build/test-results/desktopTest/
            kit-membership/build/test-results/desktopTest/
          retention-days: 14

  static-check:
    name: Static check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup JDK
        uses: ./.github/actions/setup-gradle
        with:
          java-version: ${{ env.JAVA_VERSION }}
          android: 'false'

      # detekt / apiCheck / verify-*.py 全在这里。
      # 每道门禁失败只记一次，最后统一报 —— 一道红了不用重跑前面的。
      - name: Run static gates
        run: bash scripts/ci.sh detekt api verify

      - name: Upload detekt report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        if: always()
        with:
          name: detekt-report
          path: |
            kit/build/reports/detekt/
            kit-agent-koog/build/reports/detekt/
            kit-membership/build/reports/detekt/
          retention-days: 14

  backend:
    name: Backend (gateway)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      # 这份 ci.yml 会被 install-kit.sh 原样拷进只装 KMP 模块的消费方项目，
      # 那些项目没有 backend/ 目录 —— 脚本自己判断，没 backend/ 就跳过。
      - name: Setup Node
        if: ${{ hashFiles('backend/package.json') != '' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      # 类型检查 + 契约冒烟：不花钱、不连网（skill 加载 + JSON Schema 校验 + parseOutput + SSE 断连检测）
      - name: Typecheck + smoke test
        if: ${{ hashFiles('backend/package.json') != '' }}
        run: bash scripts/ci.sh backend

      # 起一次真服务器，验路由真的通（express 大版本升级最容易在这里炸）
      - name: Boot check
        if: ${{ hashFiles('backend/package.json') != '' }}
        working-directory: backend
        run: |
          node --import tsx src/server.ts > /tmp/gateway.log 2>&1 &
          PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8787/health > /dev/null; then
              curl -sf http://localhost:8787/v1/skills
              kill $PID
              exit 0
            fi
            sleep 1
          done
          cat /tmp/gateway.log
          kill $PID 2>/dev/null || true
          exit 1
