name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 1.0.0)'
        required: true
        type: string
      is_prerelease:
        description: 'Pre-release'
        required: false
        type: boolean
        default: false

  push:
    tags:
      - 'v*'

concurrency:
  group: release
  cancel-in-progress: false

env:
  JAVA_VERSION: '17'
  ANDROID_COMPILE_SDK: '37'

jobs:
  release:
    name: Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Build release APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          ./gradlew assembleRelease \
            -PVERSION_NAME=$VERSION_NAME \
            --no-daemon

      - name: Rename APK
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
        run: |
          cd app/build/outputs/apk/release
          mv app-release.apk "Android-Kit-$VERSION_NAME.apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/Android-Kit-*.apk
          retention-days: 30

      - name: Upload mapping file
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: mapping-file
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Create GitHub Release
        if: success() && (github.event.inputs.version != '' || startsWith(github.ref, 'refs/tags/v'))
        env:
          VERSION_NAME: ${{ github.event.inputs.version || github.ref_name }}
          IS_PRERELEASE: ${{ github.event.inputs.is_prerelease || 'false' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version && format('v{0}', github.event.inputs.version) || github.ref_name }}
          name: Release ${{ github.event.inputs.version || github.ref_name }}
          draft: true
          prerelease: ${{ env.IS_PRERELEASE }}
          files: |
            app/build/outputs/apk/release/Android-Kit-*.apk
          generate_release_notes: true

  desktop-deb:
    name: Release (Desktop .deb)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # jpackage 只能在对应平台产出对应格式：deb → linux，msi → windows，dmg → macos
      - name: Package desktop (.deb)
        run: ./gradlew :kit:packageDeb --no-daemon

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-deb
          path: kit/build/compose/binaries/main/deb/*.deb
          retention-days: 30

  desktop-dmg:
    name: Release (Desktop .dmg)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Package desktop (.dmg)
        run: ./gradlew :kit:packageDmg --no-daemon

      - name: Upload desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg
          path: kit/build/compose/binaries/main/dmg/*.dmg
          retention-days: 30

  ios:
    name: Release (iOS)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # linkReleaseFramework* 产出的 .framework 就是 Xcode 要 import 的东西
      - name: Link iOS frameworks
        run: ./gradlew :kit:linkReleaseFrameworkIosArm64 :kit:linkReleaseFrameworkIosSimulatorArm64 --no-daemon

      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-frameworks
          path: kit/build/bin/ios*/releaseFramework/
          retention-days: 30

