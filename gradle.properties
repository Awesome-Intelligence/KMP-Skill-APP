# Project-wide Gradle settings.
# 16GB 机器：Gradle 4g + Kotlin 2g，给 IDE 和模拟器留余量
# 注意：Android Studio 的 Gradle JVM args 必须与此一致，否则每次 CLI 构建仍会 fork 单次 daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存：跳过重复的 configuration 阶段（依赖解析、脚本编译、AGP 模型装配）
org.gradle.configuration-cache=true
# 遇到不兼容的插件先降级为告警而不是直接失败
org.gradle.configuration-cache.problems=warn

# 刻意不写 org.gradle.user.home / org.gradle.java.home：
# 绝对路径写死在仓库里，换台机器/CI 就炸。用环境变量代替：
#   GRADLE_USER_HOME=~/.gradle   JAVA_HOME=<你的 JDK 17>
# Java toolchain 由 settings.gradle.kts 的 foojay-resolver 自动下载 17，不挑机器。

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
# 固定 Kotlin 编译 daemon 的堆大小，避免它继承 Gradle 参数后反复开新会话
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Non-transitive R classes
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 的新 DSL 已启用（android.newDsl 默认 true）：
# KMP 模块用 com.android.kotlin.multiplatform.library，Android 应用壳独立成 :app 子模块。

# 依赖校验（gradle/verification-metadata.xml）：已登记的依赖必须校验 sha256，
# 对不上就断构建 —— 供应链被污染时第一道闸门。
# 用 lenient 而不是默认的 strict：这份基线是在 Windows 上生成的（只有 JVM/Android 产物），
# macOS 上编 iOS 会多出一批 Kotlin/Native 依赖 —— strict 会因为「没登记」直接失败。
# strict 模式是给「基线完整」的仓库用的，跨平台基线不完整时 lenient 才是对的。
org.gradle.dependency.verification=lenient
