# Project-wide Gradle settings.
# 16GB 机器：Gradle 4g + Kotlin 2g，给 IDE 和模拟器留余量
# 注意：Android Studio 的 Gradle JVM args 必须与此一致，否则每次 CLI 构建仍会 fork 单次 daemon
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 配置缓存：跳过重复的 configuration 阶段（依赖解析、脚本编译、AGP 模型装配）
org.gradle.configuration-cache=true
# 遇到不兼容的插件先降级为告警而不是直接失败
org.gradle.configuration-cache.problems=warn
org.gradle.user.home=D:\\.gradle
org.gradle.java.home=C:\\Program Files\\Microsoft\\jdk-17.0.18.8-hotspot

# AndroidX
android.useAndroidX=true

# Kotlin
kotlin.code.style=official
# 固定 Kotlin 编译 daemon 的堆大小，避免它继承 Gradle 参数后反复开新会话
kotlin.daemon.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m

# Non-transitive R classes
android.nonTransitiveRClass=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true

# AGP 9 的新 DSL 已启用（android.newDsl 默认 true）：
# KMP 模块用 com.android.kotlin.multiplatform.library，Android 应用壳独立成 :app 子模块。
